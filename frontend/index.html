<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multiplayer chess platform — real-time games, AI opponent, tournaments." />
    <meta name="color-scheme" content="dark" />
    <title>Chess Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/board.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- Skip to main content (a11y) -->
    <a href="#outlet" class="skip-link">Skip to content</a>

    <!-- ============================================================
         Icon sprite — referenced with <use href="#i-name">.
         All chrome icons live here so no emoji appear in the UI.
         ============================================================ -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <!-- Chess king mark (used in the brand) -->
            <symbol id="i-king" viewBox="0 0 24 24">
                <path d="M12 3 v3 M10 6 h4 M12 6 v3 M8 9 c0 3 2 5 4 5 s4-2 4-5 M8 14 h8 v5 h-8 z"/>
            </symbol>
            <!-- Full Staunton king silhouette, used in the landing hero.
                 45×45 viewbox, strokes inherit currentColor. -->
            <symbol id="i-piece-king" viewBox="0 0 45 45">
                <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
                    <path d="M22.5 3.5v4M20 5.5h5"/>
                    <path d="M22.5 8.5c-4 3-5 6-4 9 1 2 4 3 4 3s3-1 4-3c1-3 0-6-4-9z"/>
                    <path d="M11 26c2-3 6-5 11.5-5s9.5 2 11.5 5c1 2 0 4-2 5H13c-2-1-3-3-2-5z"/>
                    <path d="M13 31c3 1 6 1.5 9.5 1.5S29 32 32 31"/>
                    <path d="M12 32.5h21v3H12z"/>
                    <path d="M9 39.5h27v-4H9z"/>
                </g>
            </symbol>
            <!-- Lobby / play -->
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5 v14 l11-7 z"/></symbol>
            <!-- Spectate -->
            <symbol id="i-eye" viewBox="0 0 24 24">
                <path d="M2 12 s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
            </symbol>
            <!-- Trophy -->
            <symbol id="i-trophy" viewBox="0 0 24 24">
                <path d="M7 4 h10 v4 a5 5 0 0 1-10 0 z M4 5 h3 v3 a3 3 0 0 1-3-3 z M20 5 h-3 v3 a3 3 0 0 0 3-3 z M9 14 h6 v3 h-6 z M8 20 h8"/>
            </symbol>
            <!-- Chart -->
            <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20 v-6 M10 20 v-11 M16 20 v-4 M22 20 h-20"/></symbol>
            <!-- Replay -->
            <symbol id="i-replay" viewBox="0 0 24 24">
                <path d="M4 12 a8 8 0 1 0 3-6"/>
                <path d="M4 4 v5 h5"/>
            </symbol>
            <!-- User -->
            <symbol id="i-user" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20 c0-4 4-6 8-6 s8 2 8 6"/>
            </symbol>
            <!-- Settings gear -->
            <symbol id="i-settings" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19 12 a7 7 0 0 0-.2-1.6 l2-1.5-2-3.5-2.4 1 a7 7 0 0 0-2.8-1.6 L13 2 h-2 l-.6 2.8 a7 7 0 0 0-2.8 1.6 l-2.4-1-2 3.5 2 1.5 a7 7 0 0 0 0 3.2 l-2 1.5 2 3.5 2.4-1 a7 7 0 0 0 2.8 1.6 L11 22 h2 l.6-2.8 a7 7 0 0 0 2.8-1.6 l2.4 1 2-3.5-2-1.5 a7 7 0 0 0 .2-1.6 z"/>
            </symbol>
            <!-- Spark (empty-state hint) -->
            <symbol id="i-spark" viewBox="0 0 24 24">
                <path d="M12 3 v4 M12 17 v4 M3 12 h4 M17 12 h4 M5.6 5.6 l2.8 2.8 M15.6 15.6 l2.8 2.8 M5.6 18.4 l2.8-2.8 M15.6 8.4 l2.8-2.8"/>
            </symbol>
            <!-- Hamburger menu -->
            <symbol id="i-menu" viewBox="0 0 24 24">
                <path d="M4 6 h16 M4 12 h16 M4 18 h16"/>
            </symbol>
            <!-- Close X -->
            <symbol id="i-close" viewBox="0 0 24 24">
                <path d="M18 6 L6 18 M6 6 l12 12"/>
            </symbol>
        </defs>
    </svg>

    <!-- ============================================================
         App frame
         ============================================================ -->
    <div class="app">
        <nav class="nav" role="navigation" aria-label="Primary">
            <a href="#/" class="nav__brand" aria-label="Chess Platform home">
                <span class="nav__brand-mark" aria-hidden="true">
                    <svg class="icon icon--sm" style="stroke: var(--on-accent); fill: none;"><use href="#i-king"/></svg>
                </span>
                <span>Chess Platform</span>
            </a>

            <button id="nav-toggle" class="nav__toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
                <svg class="icon icon--lg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-menu"/></svg>
            </button>

            <div id="nav-links" class="nav__links" role="menubar">
                <a href="#/play"         class="nav__link" role="menuitem" data-nav-key="play">Play</a>
                <a href="#/puzzle"       class="nav__link" role="menuitem" data-nav-key="puzzle">Puzzle</a>
                <a href="#/spectate"     class="nav__link" role="menuitem" data-nav-key="spectate">Spectate</a>
                <a href="#/tournaments"  class="nav__link" role="menuitem" data-nav-key="tournaments">Tournaments</a>
                <a href="#/leaderboard"  class="nav__link" role="menuitem" data-nav-key="leaderboard">Leaderboard</a>
                <a href="#/replay"       class="nav__link" role="menuitem" data-nav-key="replay">Replays</a>
            </div>

            <div class="nav__right">
                <span id="nav-conn" class="conn is-offline" aria-live="polite">
                    <span class="conn__dot" aria-hidden="true"></span>
                    <span id="nav-conn-text">Offline</span>
                </span>
                <a href="#/profile" class="btn btn--ghost btn--sm" aria-label="Profile">
                    <svg class="icon"><use href="#i-user"/></svg>
                    <span>Profile</span>
                </a>
                <a href="#/settings" class="btn btn--ghost btn--sm" aria-label="Settings">
                    <svg class="icon"><use href="#i-settings"/></svg>
                </a>
            </div>
        </nav>

        <main id="outlet" class="app-outlet">
            <!-- Router mounts screens here -->
        </main>
    </div>

    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="js/main.js?v=g3"></script>
</body>
</html>
